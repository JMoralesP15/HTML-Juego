name: QA

on:
  pull_request:
  push:
    branches:
      - main
      - infra/pages-setup
      - feature/instrumentation-consolidation-v1.2.1
      - feature/product-loop-v1.3
      - feature/curation-atmosphere-v1.4
      - feature/learning-result-ux-v1.6
      - feature/architecture-editorial-consolidation-v1.7

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify committed lockfile metadata
        run: node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(l.version!==p.version||l.packages?.['']?.version!==p.version) throw new Error('package-lock version metadata does not match package.json')"
      - name: Install pinned dependencies
        run: npm ci
      - name: Unit and contract tests
        run: npm test
      - name: Content integrity audit
        run: npm run audit
      - name: Editorial and geography report
        run: npm run report:content
      - name: General-culture curation report
        run: npm run report:culture
      - name: Architecture debt budget
        run: npm run report:architecture
      - name: Editorial provenance debt
        run: npm run report:editorial
      - name: Editorial review backlog
        run: npm run report:editorial-backlog
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate canonical visual baselines during bootstrap
        run: npm run qa:regression -- --update-snapshots
      - name: Accessibility QA
        run: npm run qa:accessibility
      - name: Visual browser QA
        run: npm run qa:visual
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: |
            test-results/screenshots
            test-results/playwright
            reports/content-metrics.json
            reports/culture-curation-v14.json
            reports/architecture-v17.json
            reports/editorial-quality-v17.json
            reports/editorial-review-backlog-v17.json
          if-no-files-found: ignore
          retention-days: 14
