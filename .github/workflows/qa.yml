name: QA

on:
  pull_request:
  push:
    branches:
      - main
      - infra/pages-setup
      - feature/instrumentation-consolidation-v1.2.1
      - feature/product-loop-v1.3
      - feature/curation-atmosphere-v1.4
      - feature/learning-result-ux-v1.6
      - feature/architecture-editorial-consolidation-v1.7

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bootstrap deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit normalized v1.7 lockfile once
        if: github.ref == 'refs/heads/feature/architecture-editorial-consolidation-v1.7' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(v1.7): normalize package lock metadata"
            git push origin HEAD:feature/architecture-editorial-consolidation-v1.7
          fi
      - name: Install pinned dependencies
        run: npm ci
      - name: Unit and contract tests
        run: npm test
      - name: Content integrity audit
        run: npm run audit
      - name: Editorial and geography report
        run: npm run report:content
      - name: General-culture curation report
        run: npm run report:culture
      - name: Architecture debt budget
        run: npm run report:architecture
      - name: Editorial provenance debt
        run: npm run report:editorial
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate canonical visual baselines during bootstrap
        run: npm run qa:regression -- --update-snapshots
      - name: Accessibility QA
        run: npm run qa:accessibility
      - name: Visual browser QA
        run: npm run qa:visual
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: |
            test-results/screenshots
            test-results/playwright
            reports/content-metrics.json
            reports/culture-curation-v14.json
            reports/architecture-v17.json
            reports/editorial-quality-v17.json
          if-no-files-found: ignore
          retention-days: 14
