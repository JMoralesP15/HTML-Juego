<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <meta name="application-name" content="QUÉ AÑO 1.8.0 beta">
  <meta name="description" content="Cinco hitos, quince segundos cada uno. Un atlas cultural interactivo para estimar, revelar, comprender y recordar.">
  <title>QUÉ AÑO · v1.8.0 beta</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="archive-night.css">
  <link rel="stylesheet" href="atlas-v12.css">
  <link rel="stylesheet" href="experience-v17.css">
  <link rel="stylesheet" href="interaction-v17.css">
  <link rel="stylesheet" href="mobile-v188.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al juego</a>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#hoy" aria-label="QUÉ AÑO, ir a Hoy">QUÉ AÑO<span class="version">1.8 beta</span></a>
      <div class="header-actions"><span id="weeklyActivity" class="weekly"></span><button id="soundToggle" class="icon-button" aria-label="Activar sonido" aria-pressed="false">Sonido: no</button><button id="settingsButton" class="icon-button" aria-label="Abrir configuración">Ajustes</button></div>
    </header>
    <nav class="main-nav" aria-label="Secciones del juego">
      <button data-view="hoy" class="active" aria-current="page"><span class="nav-symbol" aria-hidden="true">◉</span><span>Hoy</span></button>
      <button data-view="repaso"><span class="nav-symbol" aria-hidden="true">↺</span><span>Repaso</span><span id="dueBadge" class="badge" hidden></span></button>
      <button data-view="orden"><span class="nav-symbol" aria-hidden="true">↔</span><span>Ordenar</span></button>
      <button data-view="coleccion"><span class="nav-symbol" aria-hidden="true">▦</span><span>Colección</span></button>
      <button data-view="estadisticas"><span class="nav-symbol" aria-hidden="true">▥</span><span>Estadísticas</span></button>
    </nav>
    <main id="main" tabindex="-1"><div id="view" class="view"><p>Cargando tu archivo…</p></div></main>
  </div>
  <dialog id="detailDialog" aria-labelledby="dialogTitle"><div class="dialog-header"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon-button" aria-label="Cerrar ventana">Cerrar ×</button></div><div id="dialogContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <p id="answerAnnouncement" class="sr-only" role="status" aria-live="polite"></p>
  <div id="storageWarning" class="storage-warning" role="status" hidden>No pudimos guardar tu progreso en este navegador. La partida sigue funcionando, pero al cerrar la pestaña podrías perder el avance. Puedes exportar una copia desde Ajustes.</div>
  <input id="backupInput" type="file" accept="application/json,.json" hidden>
  <input id="editorInput" type="file" accept="application/json,.json" hidden>
  <noscript>Activa JavaScript para jugar. Este juego no necesita conexión.</noscript>
  <script src="js/content.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/editorial.js"></script>
  <script src="js/editorial-verification-v18.js"></script>
  <script src="js/editorial-v18-manual.js"></script>
  <script src="js/content-v12.js"></script>
  <script src="js/curation-v14.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/archive-night.js"></script>
  <script src="js/archive-numbering.js"></script>
  <script src="js/atlas-v12.js"></script>
  <script src="js/app.js"></script>
  <script src="js/runtime-contract.js"></script>
  <script src="js/semantic-contract.js"></script>
  <script src="js/analytics-config.js"></script>
  <script src="js/analytics-v17.js"></script>
  <script src="js/product-v13.js"></script>
  <script src="js/experience-v14.js"></script>
  <script src="js/simplification-v15.js"></script>
  <script src="js/learning-v16.js"></script>
  <script src="js/experience-v18.js"></script>
  <script src="js/mobile-v188.js"></script>
</body>
</html>
